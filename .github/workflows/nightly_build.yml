name: Nightly Build

# Nightly full-platform CI.
# Runs every day at 06:00 CST (China Standard Time) = 22:00 UTC, and can
# be triggered manually via the "Run workflow" button (workflow_dispatch).
#
# NOTE: The DingTalk notification relies on the repository secret
# `DINGTALK_WEBHOOK_URL`. Configure it under
# Settings -> Secrets and variables -> Actions -> New repository secret.

on:
  schedule:
    # Runs daily at 06:00 CST (China Standard Time) = 22:00 UTC
    - cron: '0 22 * * *'

  workflow_dispatch:

concurrency:
  group: nightly-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Main build and test matrix (full platform coverage)
  build-and-test-macos-arm64:
    name: Build & Test (macos-arm64)
    uses: ./.github/workflows/03-macos-linux-build.yml
    with:
      platform: macos-arm64
      os: macos-15
    secrets: inherit

  build-and-test-macos-26-arm64:
    name: Build & Test (macos-26-arm64)
    uses: ./.github/workflows/03-macos-linux-build.yml
    with:
      platform: macos-arm64
      os: macos-26
    secrets: inherit

  build-and-test-linux-arm64:
    name: Build & Test (linux-arm64)
    uses: ./.github/workflows/03-macos-linux-build.yml
    with:
      platform: linux-arm64
      os: ubuntu-24.04-arm
    secrets: inherit

  build-and-test-linux-x64:
    name: Build & Test (linux-x64)
    uses: ./.github/workflows/03-macos-linux-build.yml
    with:
      platform: linux-x64
      os: ubuntu-24.04
    secrets: inherit

  build-and-test-linux-x64-clang:
    name: Build & Test (linux-x64-clang)
    uses: ./.github/workflows/03-macos-linux-build.yml
    with:
      platform: linux-x64-clang
      os: ubuntu-24.04
      compiler: clang
    secrets: inherit

  build-android:
    name: Build & Test (android)
    uses: ./.github/workflows/04-android-build.yml
    secrets: inherit

  build-and-test-on-windows:
    name: Build & Test (Windows)
    uses: ./.github/workflows/05-windows-build.yml
    secrets: inherit

  build-ios:
    name: Build & Test (iOS)
    uses: ./.github/workflows/06-ios-build.yml
    secrets: inherit

  # DingTalk notification (runs after all build jobs, even on failure)
  notify:
    name: DingTalk Notification
    needs:
      - build-and-test-macos-arm64
      - build-and-test-macos-26-arm64
      - build-and-test-linux-arm64
      - build-and-test-linux-x64
      - build-and-test-linux-x64-clang
      - build-android
      - build-and-test-on-windows
      - build-ios
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Send DingTalk notification
        env:
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          RESULT_MACOS_ARM64: ${{ needs.build-and-test-macos-arm64.result }}
          RESULT_MACOS_26_ARM64: ${{ needs.build-and-test-macos-26-arm64.result }}
          RESULT_LINUX_ARM64: ${{ needs.build-and-test-linux-arm64.result }}
          RESULT_LINUX_X64: ${{ needs.build-and-test-linux-x64.result }}
          RESULT_LINUX_X64_CLANG: ${{ needs.build-and-test-linux-x64-clang.result }}
          RESULT_ANDROID: ${{ needs.build-android.result }}
          RESULT_WINDOWS: ${{ needs.build-and-test-on-windows.result }}
          RESULT_IOS: ${{ needs.build-ios.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${DINGTALK_WEBHOOK_URL}" ]; then
            echo "DINGTALK_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          # Map each platform to its job result.
          declare -A results=(
            ["linux-x64"]="${RESULT_LINUX_X64}"
            ["linux-x64-clang"]="${RESULT_LINUX_X64_CLANG}"
            ["linux-arm64"]="${RESULT_LINUX_ARM64}"
            ["macos-arm64"]="${RESULT_MACOS_ARM64}"
            ["macos-26-arm64"]="${RESULT_MACOS_26_ARM64}"
            ["windows"]="${RESULT_WINDOWS}"
            ["ios"]="${RESULT_IOS}"
            ["android"]="${RESULT_ANDROID}"
          )

          # Build per-platform status lines and collect failures.
          status_lines=""
          failed_platforms=""
          overall_success=true
          for platform in linux-x64 linux-x64-clang linux-arm64 macos-arm64 macos-26-arm64 windows ios android; do
            result="${results[$platform]}"
            case "${result}" in
              success)
                icon="✅"
                ;;
              skipped)
                icon="⏭️"
                ;;
              *)
                icon="❌"
                overall_success=false
                failed_platforms="${failed_platforms} ${platform}"
                ;;
            esac
            status_lines="${status_lines}- ${icon} ${platform}: ${result}\n"
          done

          if [ "${overall_success}" = "true" ]; then
            title="Nightly Build 结果"
            header="<font color='#36b37e'>### ✅ Nightly Build 成功</font>"
            status_text="**构建状态**: 成功"
            failed_section=""
          else
            title="Nightly Build 结果"
            header="<font color='#de350b'>### ❌ Nightly Build 失败</font>"
            status_text="**构建状态**: 失败"
            failed_section="\n\n**失败平台**:${failed_platforms}"
          fi

          markdown_text="${header}\n\n${status_text}\n\n**各平台状态**:\n${status_lines}${failed_section}\n\n[查看 GitHub Actions 运行详情](${RUN_URL})"

          payload=$(cat <<EOF
          {
            "msgtype": "markdown",
            "markdown": {
              "title": "${title}",
              "text": "${markdown_text}"
            }
          }
          EOF
          )

          curl -sS -X POST "${DINGTALK_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "${payload}"
        shell: bash
